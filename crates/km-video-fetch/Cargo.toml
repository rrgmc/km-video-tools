[package]
name = "km-video-fetch"
description = "Fetch a karaoke video with yt-dlp, already in the shape a karaoke package wants."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# **No features: the check-and-normalize half is unconditional.** Reaching the packaging profile by
# linking ffmpeg needs libclang to build, which is what puts that half behind a default-off feature
# in the karaoke app. Reading a file with `ffprobe` needs neither, so the tool's third reason to
# exist is always compiled in.
[dependencies]
km-video-core = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }

[lints]
workspace = true
