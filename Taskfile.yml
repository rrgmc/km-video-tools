# Task runner for this repository. https://taskfile.dev
#
#   task --list        what is routine
#   task check         fmt, clippy, tests -- in the order a failure is cheapest to read
#   task dist          stage a folder somebody can be handed, into dist/
#   task clean:old     take away the staged releases that are not this version
#
# **Everything here is a thin wrapper over cargo**, deliberately. A task that does something cargo
# cannot is a task worth having; a task that renames `cargo test` is one more name to learn. The
# three that earn their place are `check` (an order, not a command), `dist` (a shell script) and
# `clean` (which knows that `dist/` is output too -- and which is a script rather than an `rm`,
# because Task's own shell has no `rm` on Windows; see the banner above it).
#
# **Run it from whatever shell you like -- cmd, PowerShell, Windows Terminal, Git Bash.** `dist` calls
# a bash script, and typing it needs no bash: Task runs every command through its own embedded POSIX
# shell rather than the host's, and the `SH` variable below finds Git Bash from git's own location. So
# nothing has to be on PATH but `git` -- which is the whole point on Windows, where Git's `bin/` is
# normally *not* on PATH and a bare `bash` is WSL's.
#
# The rule any new task has to respect, and it is the same one the karaoke app's Taskfile writes
# down: a bash script is invoked through `{{.SH}}` and never a bare `bash`.

version: '3'

silent: true

vars:
  # The staging script is bash, and **on Windows a bare `bash` is WSL's** -- a different git looking
  # at a different filesystem, with no MSVC cargo behind it. Naming Git Bash explicitly is the fix,
  # and it is the same one the karaoke app's Taskfile makes for the same reason.
  #
  # Without this, `task dist` does not reach a wrong bash -- it reaches none at all: Task's embedded
  # shell honours no `#!` line, so it hands `cmd.sh` to Windows as an executable and Windows answers
  # `%1 is not a valid Win32 application`.
  #
  # Derived from git's own location rather than hardcoded, so a non-default install still works:
  # `git --exec-path` gives `<root>/mingw64/libexec/git-core`, and the root is what is wanted.
  # Override with `task dist SH=/path/to/bash` if that ever fails to find one.
  SH:
    sh: '{{if eq OS "windows"}}p=$(git --exec-path); echo "${p%/mingw*}/bin/bash.exe"{{else}}echo bash{{end}}'

  # Set on the command line: `task dist:setup VERBOSE=1`, `task dist:bin ZIP=1`. Declared here so
  # that `{{if .VERBOSE}}` is false rather than an error when nothing was passed.
  VERBOSE: ''
  ZIP: ''

tasks:
  default:
    desc: What `task check` does, without running it
    cmds:
      - task --list

  check:
    desc: fmt, clippy and tests, in the order a failure is cheapest to read
    cmds:
      - task: toolchain-pin
      - task: fmt-check
      - task: lint
      - task: test

  # First, because it reads three files and says one line -- and because the thing it guards against
  # is a build on a compiler nobody chose, which is not a failure the three below can produce.
  toolchain-pin:
    desc: Fail if rust-toolchain.toml and Cargo.toml disagree about the compiler
    cmds:
      - '"{{.SH}}" tools/dev/check-toolchain-pin.sh'

  # `How a document in this repository is written` says prose states the rule and the reason somebody
  # needs in order not to undo it, and never narrates how it was arrived at. It applies that to code
  # comments and commit messages too. This catches the shapes that have one -- `what something used
  # to be`, `chronology`, `meta-commentary` -- and cannot see the appositive tail or the paragraph of
  # reassurance, so it is a floor rather than a pass.
  #
  # **Not in `check`, and `--changed` is why it can be run at all.** It reads the lines a branch adds
  # by line rather than by file, so touching a file does not inherit that file's backlog. The bare
  # `tools/dev/check-prose.sh` is the whole tree, and it is the worklist for clearing the rest.
  lint:prose:
    desc: 'Check that the prose this branch adds states its rule rather than narrating it'
    cmds:
      - '"{{.SH}}" tools/dev/check-prose.sh --changed'

  fmt:
    desc: Format everything
    cmds:
      - cargo fmt --all

  fmt-check:
    desc: Fail if anything is unformatted
    cmds:
      - cargo fmt --all --check

  lint:
    desc: clippy over every target, warnings denied
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  test:
    desc: The test suite
    cmds:
      - cargo test --workspace

  build:
    desc: Build the workspace
    cmds:
      - cargo build --workspace

  run:
    desc: 'Run km-video-fetch: task run -- <url> --out ./songs'
    cmds:
      - cargo run -p km-video-fetch -- {{.CLI_ARGS}}

  ui:
    desc: Run km-video-downloader in its own window
    cmds:
      - cargo run -p km-video-downloader -- {{.CLI_ARGS}}

  icon:
    desc: Redraw the application icons into icon/
    cmds:
      - cargo run -p km-video-downloader --example icon

  dist:
    desc: Stage every program into dist/<app>/<platform>/<app>-<version>-<triple>/
    cmds:
      - '"{{.SH}}" tools/dist/cmd.sh {{.CLI_ARGS}}'

  dist:zip:
    desc: The same, plus a versioned .zip of each folder
    cmds:
      - '"{{.SH}}" tools/dist/cmd.sh --zip {{.CLI_ARGS}}'

  # One folder with all of it in it, which is the other question people ask of a build. `task dist`
  # answers "what is a release" -- a folder per program, each carrying its own version; this answers
  # "give me everything", which otherwise means unpacking two folders and merging them by hand. The
  # merge has a trap in it, which is the reason this is a script rather than advice: both staged
  # folders carry a `README.txt` and the two licence texts under the same names, so a plain copy
  # keeps one README and silently loses the other.
  #
  # **Two folders, not one.** `dist/bin/<platform>` holds the form you double-click and
  # `dist/bin-console/<platform>` the form that prints, which on Windows is a pair of executables and
  # on macOS a bundle beside a bare binary. Anything with only one form is in both.
  #
  # **Not part of `task dist`**, for the reason `dist:setup` is not: it runs tools/dist/cmd.sh itself,
  # so folding it in would stage every program twice. `task dist:bin -- --no-build` is the fast path
  # when something has already staged.
  dist:bin:
    desc: 'Stage one folder with every executable this platform can build (ZIP=1 VERBOSE=1)'
    cmds:
      - '"{{.SH}}" tools/dist/bin.sh {{if .ZIP}}--zip{{end}} {{if .VERBOSE}}--verbose{{end}} {{.CLI_ARGS}}'

  # The setup program, which is a carrier rather than a folder: one installer holding both programs,
  # with a checkbox for each. The fan-out is not an `if`: both arms are called unconditionally and the
  # one whose `platforms:` does not match the host is skipped rather than failed, so exactly one runs.
  #
  # **Not part of `task dist`**, because both arms run tools/dist/cmd.sh themselves and folding them
  # in would stage every program twice. `task dist:setup -- --no-build` is the fast path when
  # something has already staged.
  dist:setup:
    desc: "Build this platform's setup program -- one installer, both programs (VERBOSE=1)"
    cmds:
      - task: dist:setup:windows
      - task: dist:setup:macos

  dist:setup:windows:
    internal: true
    platforms: [windows]
    cmds:
      - '"{{.SH}}" tools/platform/windows/installer.sh {{if .VERBOSE}}--verbose{{end}} {{.CLI_ARGS}}'

  # `--install` is the one flag worth knowing and it has no variable, deliberately: it installs into
  # /Applications and /usr/local for real, asks for an administrator password and then removes it
  # again, so it should be typed rather than set. `task dist:setup -- --install`.
  dist:setup:macos:
    internal: true
    platforms: [darwin]
    cmds:
      - '"{{.SH}}" tools/platform/macos/installer.sh {{if .VERBOSE}}--verbose{{end}} {{.CLI_ARGS}}'

  # -- clearing it out -------------------------------------------------------------------------------
  #
  # All three are tools/dist/clean.sh, and the shell lives there rather than here for a reason that is
  # not style: Task's embedded shell has `for`, `case` and parameter expansion on every platform but
  # **no `rm`** -- that is an external command, and there is no `rm.exe` on Windows any more than there
  # is a `sed`. `clean: rm -rf dist` stood here until this script existed and, run from anything but a
  # Git Bash, was `"rm": executable file not found in $PATH` every time. Choosing a script is what this
  # file does for staging too. `--dry-run` is worth knowing about and is reached like any other flag.

  clean:
    desc: 'Remove every staged release under dist/, leaving target/ alone (--dry-run to look first)'
    cmds:
      - '"{{.SH}}" tools/dist/clean.sh --all {{.CLI_ARGS}}'

  # Keeps the current version and takes the rest. **It knows about no product in particular**, which is
  # the property to preserve: one number out of the manifest covers everything under `dist/`, because
  # every crate here is `version.workspace = true`. The things it can never remove -- the versionless
  # `dist/bin/<platform>`, the macOS bundle -- are explained where they are handled, in the script.
  #
  # Worth running before `task dist:bin` or `task dist:setup` on any machine that has staged a previous
  # release, and see the note above `dist_staged_dir` in tools/dist/common.sh for what used to happen
  # when it was not.
  clean:old:
    desc: 'Remove staged releases from older versions, keeping the current one (--dry-run to look first)'
    cmds:
      - '"{{.SH}}" tools/dist/clean.sh --old {{.CLI_ARGS}}'

  clean:all:
    desc: Remove dist/ and everything cargo built
    cmds:
      - '"{{.SH}}" tools/dist/clean.sh --all {{.CLI_ARGS}}'
      - cargo clean
