# Task runner for this repository. https://taskfile.dev
#
#   task --list        what is routine
#   task check         fmt, clippy, tests -- in the order a failure is cheapest to read
#   task dist          stage a folder somebody can be handed, into dist/
#
# **Everything here is a thin wrapper over cargo**, deliberately. A task that does something cargo
# cannot is a task worth having; a task that renames `cargo test` is one more name to learn. The
# three that earn their place are `check` (an order, not a command), `dist` (a shell script) and
# `clean` (which knows that `dist/` is output too).
#
# **Run it from whatever shell you like -- cmd, PowerShell, Windows Terminal, Git Bash.** `dist` calls
# a bash script, and typing it needs no bash: Task runs every command through its own embedded POSIX
# shell rather than the host's, and the `SH` variable below finds Git Bash from git's own location. So
# nothing has to be on PATH but `git` -- which is the whole point on Windows, where Git's `bin/` is
# normally *not* on PATH and a bare `bash` is WSL's.
#
# The rule any new task has to respect, and it is the same one karaokemachine's Taskfile writes down:
# a bash script is invoked through `{{.SH}}` and never a bare `bash`.

version: '3'

silent: true

vars:
  # The staging script is bash, and **on Windows a bare `bash` is WSL's** -- a different git looking at
  # a different filesystem, with no MSVC cargo behind it. Naming Git Bash explicitly is the fix, and it
  # is the same one karaokemachine's Taskfile makes for the same reason.
  #
  # Without this, `task dist` does not reach a wrong bash -- it reaches none at all: Task's embedded
  # shell honours no `#!` line, so it hands `cmd.sh` to Windows as an executable and Windows answers
  # `%1 is not a valid Win32 application`.
  #
  # Derived from git's own location rather than hardcoded, so a non-default install still works:
  # `git --exec-path` gives `<root>/mingw64/libexec/git-core`, and the root is what is wanted.
  # Override with `task dist SH=/path/to/bash` if that ever fails to find one.
  SH:
    sh: '{{if eq OS "windows"}}p=$(git --exec-path); echo "${p%/mingw*}/bin/bash.exe"{{else}}echo bash{{end}}'

  # Set on the command line: `task dist:setup VERBOSE=1`. Declared here so that `{{if .VERBOSE}}` is
  # false rather than an error when nothing was passed.
  VERBOSE: ''

tasks:
  default:
    desc: What `task check` does, without running it
    cmds:
      - task --list

  check:
    desc: fmt, clippy and tests, in the order a failure is cheapest to read
    cmds:
      - task: fmt-check
      - task: lint
      - task: test

  fmt:
    desc: Format everything
    cmds:
      - cargo fmt --all

  fmt-check:
    desc: Fail if anything is unformatted
    cmds:
      - cargo fmt --all --check

  lint:
    desc: clippy over every target, warnings denied
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  test:
    desc: The test suite
    cmds:
      - cargo test --workspace

  build:
    desc: Build the workspace
    cmds:
      - cargo build --workspace

  run:
    desc: 'Run km-video-fetch: task run -- <url> --out ./songs'
    cmds:
      - cargo run -p km-video-fetch -- {{.CLI_ARGS}}

  ui:
    desc: Run km-video-downloader in its own window
    cmds:
      - cargo run -p km-video-downloader -- {{.CLI_ARGS}}

  icon:
    desc: Redraw the application icons into icon/
    cmds:
      - cargo run -p km-video-downloader --example icon

  dist:
    desc: Stage every program into dist/<app>/<platform>/<app>-<version>-<triple>/
    cmds:
      - '"{{.SH}}" tools/dist/cmd.sh {{.CLI_ARGS}}'

  dist:zip:
    desc: The same, plus a versioned .zip of each folder
    cmds:
      - '"{{.SH}}" tools/dist/cmd.sh --zip {{.CLI_ARGS}}'

  # The setup program, which is a carrier rather than a folder: one installer holding both programs,
  # with a checkbox for each. The fan-out is not an `if`: both arms are called unconditionally and the
  # one whose `platforms:` does not match the host is skipped rather than failed, so exactly one runs.
  #
  # **Not part of `task dist`**, because both arms run tools/dist/cmd.sh themselves and folding them
  # in would stage every program twice. `task dist:setup -- --no-build` is the fast path when
  # something has already staged.
  dist:setup:
    desc: "Build this platform's setup program -- one installer, both programs (VERBOSE=1)"
    cmds:
      - task: dist:setup:windows
      - task: dist:setup:macos

  dist:setup:windows:
    internal: true
    platforms: [windows]
    cmds:
      - '"{{.SH}}" tools/platform/windows/installer.sh {{if .VERBOSE}}--verbose{{end}} {{.CLI_ARGS}}'

  # `--install` is the one flag worth knowing and it has no variable, deliberately: it installs into
  # /Applications and /usr/local for real, asks for an administrator password and then removes it
  # again, so it should be typed rather than set. `task dist:setup -- --install`.
  dist:setup:macos:
    internal: true
    platforms: [darwin]
    cmds:
      - '"{{.SH}}" tools/platform/macos/installer.sh {{if .VERBOSE}}--verbose{{end}} {{.CLI_ARGS}}'

  clean:
    desc: Remove the staged output in dist/, leaving target/ alone
    cmds:
      - rm -rf dist

  clean:all:
    desc: Remove dist/ and everything cargo built
    cmds:
      - rm -rf dist
      - cargo clean
