[workspace]
resolver = "3"
# A glob rather than a list, and that is the one decision this file makes that is about the future.
# The repository exists to hold more than one program -- `km-video-fetch` is the command line, and a
# local web UI in the shape of the karaoke app's `km-package-builder` is planned beside it -- so a
# new member is a new directory and nothing else. `crates/km-video-core` is where anything two
# programs would both need lives; a binary crate here should be a command line and its output, and
# little more.
members = ["crates/*"]

[workspace.package]
version = "1.10.0"
edition = "2024"
# **Equal to the pin in `rust-toolchain.toml`, and bumped with it.** That file decides the version;
# this repeats it because no format lets a manifest derive it, and `tools/dev/check-toolchain-pin.sh`
# fails if the two ever disagree.
#
# Understating it would not be merely untidy. There is no `clippy.toml`, so this number *is* clippy's
# MSRV, and a low one suppresses the lints that suggest the idioms a newer compiler has; and
# `resolver = "3"` is MSRV-aware, so it would also make `cargo update` prefer needlessly old
# dependencies. For something built and handed out rather than published, the honest floor is the
# compiler it is built with -- and nothing downstream reads this to decide anything, every member
# here being `publish = false`.
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rrgmc/km-video-tools"
publish = false

# One version table so two members cannot drift onto two versions of the same crate.
[workspace.dependencies]
km-video-core = { path = "crates/km-video-core" }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# The web UI's half. Every version here is the one the karaoke app pins for the same crate, so a
# person moving between the two repositories meets one axum and one askama rather than two.
#
# **No `ws` on axum and no `tower-http` at all.** The first is for a push channel this does not have;
# the second was how the package builder used to serve its static files, and it removed it — one
# executable, no folder, nothing to lose. `tower` is a dev-dependency only, for driving the router
# through `oneshot` in a test without binding a socket.
axum = { version = "0.8.9", features = ["multipart"] }
# `serde_json` is what gives askama the `json` filter, and that filter is load-bearing rather than a
# convenience: a Windows path inside an `hx-vals` attribute must be serialized in Rust, because the
# HTML escaper leaves backslashes alone and `D:\tunes` is not valid JSON. See `static/README.md`.
askama = { version = "0.16.0", features = ["serde_json"] }
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "sync",
    "time",
] }
directories = "6.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower = "0.5.3"

# The window. `tao` opens it and owns the main thread; `wry` puts the platform's own webview in it
# and points that at the loopback URL the program is already serving — so there is one set of
# templates answering for the window and for a browser tab alike.
#
# **`muda` is macOS's alone**, and is a real need rather than a decoration: on that platform ⌘Q is a
# key equivalent on the *application menu* and not a key the window is sent, so a shell with no menu
# bar cannot be quit with the keyboard — nor can its fields be copied and pasted into. `tao` never
# makes one.
wry = "0.56.1"
tao = "0.37.0"
muda = "0.19.3"

# The application icon, inside the Windows executable where Explorer and the taskbar can read it
# before the process starts, and the generator that draws it.
winresource = "0.1.31"
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }

# `missing_docs` is load-bearing rather than a matter of taste: every item in this code carries a doc
# comment *because of this lint*, and the comments are where the reasoning is. Turning it off would
# not delete them, it would let them rot.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
