name: ci

# **Two runners, because `std::path` is not the same program on both.** This is pure Rust with no C
# dependencies, and that was long taken to mean one runner proved everything. It does not. Paths are
# parsed by rules that differ per platform, and `list::destination` — which decides whether a line of
# a list may name a folder — was written on Windows, passed there, and on Linux accepted `\windows`
# and `C:\Windows`, a backslash being an ordinary filename character there. The first fix for that
# then failed the other way round, because Windows takes the separator out of `anime\openings` and
# hands back two spotless ordinary names. Each platform caught what the other could not, and only one
# of them was running here.
#
# It is not only paths. There is a `#[cfg(windows)]` in `profile`, two in `desktop` and the whole of
# the downloader's `build.rs`, none of which any job compiled until the second runner existed.
#
# **macOS is deliberately still absent**, because it would prove nothing this pair does not: its path
# rules are Unix's, so Linux covers them, and GitHub bills it at 10x against Windows' 2x. The day
# something here is genuinely Darwin-shaped is the day to add it.
#
# **`fail-fast: false`**, because the whole point is that one runner sees what the other cannot, and a
# cancelled job is a platform that did not report.
#
# **No `--all-features`.** The workspace has exactly one feature — `km-video-downloader/desktop`,
# and it is on by default — so the flag would select precisely what these commands already build and
# prove nothing the job does not already prove. It is also a broken job the day a member gains a
# feature that is not merely additive, and adding it before it is needed is a cost with no matching
# benefit.
#
# **The off position is a step of its own**, because nothing above reaches it: `desktop` is on by
# default, so the whole run builds the window and none of it builds the browser-only program — the
# one a Linux machine without libwebkit2gtk needs, and the only configuration in which `wry`, `tao`
# and `muda` are absent. See `It is an application with a window, not a program that prints an
# address` in docs/decisions.md.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # v7 rather than v4: v4 targets Node 20, which the runners now force onto Node 24 and warn
      # about on every run. v5 is the release that moved to Node 24; v7 is current, and its breaking
      # change — refusing to check a fork's head out for `pull_request_target` and `workflow_run` —
      # cannot reach this file, which triggers on plain `pull_request`.
      - uses: actions/checkout@v7

      # **The toolchain comes from `rust-toolchain.toml` and is named nowhere in this file.**
      # `rustup toolchain install` with no toolchain argument resolves that file, the `components`
      # list included, so a bump is one line there and no line here. The runners ship rustup
      # already, so there is nothing to install it with first, and there is no `rustup default` —
      # the file governs this checkout whatever the runner's default is. See
      # `The Rust toolchain is pinned exactly` in docs/decisions.md.
      #
      # `dtolnay/rust-toolchain` cannot replace this: its `toolchain` input is required and it does
      # not read `rust-toolchain.toml`, so it would mean the version written twice.
      # `tools/dev/check-toolchain-pin.sh` fails if it appears here.
      #
      # `--no-self-update` because a rustup that upgrades itself mid-job has nothing to gain.
      - run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2

      # **ffmpeg** is here for the day a test actually runs a binary — the parsing tests read
      # captured `ffprobe` documents out of string literals and need nothing installed, and a job
      # without it would fail about a missing program rather than about the change.
      #
      # **libwebkit2gtk is what `wry` links**, and the `desktop` feature is on by default — so
      # without it this job fails to *link*, not to compile, with an error naming a `.so` and not
      # the feature. Installed rather than turned off, so that what CI builds is what a person
      # building this gets: a `--no-default-features` job would leave the window code unchecked
      # until somebody on a desktop noticed.
      #
      # **Linux only, because there is nothing to install on the other one.** `wry` reaches WebView2
      # on Windows and that ships with the OS, and no test here spawns a program. The day one does,
      # ffmpeg has to arrive on both runners rather than this step growing an `else`.
      - name: Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev pkg-config

      - name: Check
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      # **The off position**, which the run above never reaches: `desktop` is on by default, so
      # everything before this builds the window and nothing builds the browser-only program — the
      # one a Linux machine without libwebkit2gtk needs, and the only configuration in which `wry`,
      # `tao` and `muda` are absent. That is what makes it the build that can rot unnoticed.
      #
      # **`clippy --all-targets` rather than `test`**, because what breaks in this configuration is
      # *compiling* it — an import or a function that turned out to live behind the feature — and
      # `--all-targets` compiles the test code too without paying to run a suite that is the same one
      # above less the two window tests the feature gates.
      #
      # On both runners, for the reason the matrix exists at all: carving a platform out of a check
      # wants a reason, and there is none here.
      - name: The browser-only build
        run: cargo clippy -p km-video-downloader --no-default-features --all-targets -- -D warnings
